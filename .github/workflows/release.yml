name: build-and-release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # A tag pushed by hand satisfies the idempotency check below, which used to
      # skip BOTH the Release and the npm publish. Set this to publish a version
      # whose tag already exists on the remote.
      force_publish:
        description: 'Publish even though the v<version> tag already exists'
        type: boolean
        default: false

# GitHub Release + tag creation need write access to the repo. npm publish does
# NOT use a stored token: it authenticates with npm Trusted Publishing (OIDC), so
# there is no long-lived NPM_TOKEN secret to rotate or to let go stale. That is
# also why this file is named in the trusted publisher on npmjs.com.
#
# Two things have to stay true for the publish to work, and both of them failed
# silently the first time this path ran for real (0.8.24, 2026-11-16):
#   `id-token: write` must be granted below, or the runner cannot mint the OIDC
#   token npm exchanges for a publish credential, and the registry answers 404 as
#   if the package did not exist.
#   npm must be 11.5.1 or newer, because older versions cannot do the exchange.
#   Node 22 ships npm 10, so the publish step installs a newer npm explicitly.
# The one-time npmjs.com side (package -> Settings -> Trusted Publisher) names this
# repository and this workflow file.
permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pin ruff to the version the repo is validated against. `ruff` unpinned
      # tracks the latest on PyPI, whose default rule set can grow (e.g. UP031
      # percent-format) and break CI on a passing tree. bump this in lockstep
      # with the local checkout.
      - name: Install ruff (lint dependency)
        run: pip install ruff==0.15.13
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate (tests + lint + pack)
        run: npm run validate

  release:
    name: Tag, release, publish
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.tag.outputs.released }}
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read package version
        id: version
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Check whether v<version> tag already exists (idempotency)
        id: tag
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git tag -l "$TAG" | grep -q "$TAG"; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            RELReleased=false
            echo "Tag $TAG exists; not creating it again."
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
            RELReleased=true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Publishing is a separate question from tagging. The npm step has its
          # own already-live guard, and the Release step is idempotent in gh, so
          # this only decides whether to ask them at all.
          if [ "${{ inputs.force_publish }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "force_publish requested; running the release and publish steps."
          else
            # RELReleased is set in both branches above; do not re-read this step's own
            # outputs here, actionlint rejects self-reference within a step.
            PUBLISH="${RELReleased:-false}"
            echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release
        id: release
        if: steps.tag.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "pi-sleep-agent ${{ steps.version.outputs.version }}" \
            --notes "Release ${{ steps.version.outputs.version }} of pi-sleep-agent." \
            || echo "release already exists; continuing."
      - uses: actions/setup-node@v4
        if: steps.tag.outputs.publish == 'true'
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish to npm (skip only when the registry already serves the version)
        if: steps.tag.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # OIDC exchange needs npm 11.5.1+; the setup-node above pins Node 22,
          # which ships npm 10, so the publish runs on an explicitly newer CLI.
          # Without this the registry answers 404 on a package that exists, which
          # is the failure this step's first real run produced.
          npm install -g npm@^11.5.1
          npm --version
          # registry-viewer can lag behind the write. An E404 on a version that
          # IS live would otherwise send us into a publish that fails the run.
          for i in 1 2 3; do
            if npm view "pi-sleep-agent@$VERSION" version >/dev/null 2>&1; then
              echo "pi-sleep-agent@$VERSION already published; skipping."
              exit 0
            fi
            echo "attempt $i: pi-sleep-agent@$VERSION not visible yet"
            sleep 15
          done
          # No `--provenance` flag and no token: `id-token: write` plus the trusted
          # publisher on npmjs.com make npm attach provenance on its own. No `|| true`
          # either: a failed publish must fail the job, or a green run lies.
          npm publish --access public
