name: build-and-release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # A tag pushed by hand satisfies the idempotency check below, which used to
      # skip BOTH the Release and the npm publish. Set this to publish a version
      # whose tag already exists on the remote.
      force_publish:
        description: 'Publish even though the v<version> tag already exists'
        type: boolean
        default: false
      # A build stamp, not a release: the version gets a `-dev.<UTC stamp>`
      # suffix and publishes under the `dev` dist-tag, so `latest` never moves
      # and nobody installing the package by name receives an unfinished build.
      # Use this when the point is "a fresh build exists", not "a version shipped".
      dev_release:
        description: 'Publish a -dev.<UTC> build on the dev dist-tag (latest untouched)'
        type: boolean
        default: false

# GitHub Release + tag creation need write access to the repo. npm publish takes
# whichever of two credentials the repo has, in this order:
#   the NPM_TOKEN secret, when it is set (an automation token, so no 2FA prompt);
#   npm Trusted Publishing (OIDC), when it is not.
#
# Both are kept working because the failure mode is silent. The first real run of
# this step (0.8.24, 2026-11-16) answered `404 Not Found - PUT .../pi-sleep-agent`
# on a package that plainly exists, and the cause was in this file: the job held
# only `contents: write`, so the runner could not mint the OIDC token, and
# `setup-node` pins Node 22 whose npm 10 cannot perform the exchange either. The
# registry reports both as a package that does not exist.
#
# So: `id-token: write` stays granted below, and the publish step installs npm
# 11.5.1+ before it runs. Where the OIDC path is used, the one-time npmjs.com side
# (package -> Settings -> Trusted Publisher) has to name this repository and this
# workflow file; the token path needs no such setting, only the secret.
#
# Two kinds of run reach npm, and which one you get is the point of the
# `dev_release` input:
#   a real version, driven by a change to `package.json`, publishes to `latest`;
#   a stamped build (`0.8.<n>-dev.<UTC minute>`) publishes to `dev`, keeps
#   `package.json` untouched, and skips the GitHub Release. Runs in a loop are
#   meant to be the second kind, because `latest` is a promise to everyone who
#   installs the package by name and a machine on a timer cannot make it.
permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pin ruff to the version the repo is validated against. `ruff` unpinned
      # tracks the latest on PyPI, whose default rule set can grow (e.g. UP031
      # percent-format) and break CI on a passing tree. bump this in lockstep
      # with the local checkout.
      - name: Install ruff (lint dependency)
        run: pip install ruff==0.15.13
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate (tests + lint + pack)
        run: npm run validate

  release:
    name: Tag, release, publish
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.tag.outputs.released }}
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read package version
        id: version
        run: |
          VER=$(node -p "require('./package.json').version")
          # A dev build is stamped, not bumped. The stamp has to land in the file
          # itself: `npm publish` reads the version from package.json and ignores
          # any variable this step exports, so a stamp that lives only in
          # $GITHUB_OUTPUT publishes the un-stamped number and collides with the
          # version the first dev build already took (measured on 2026-11-17,
          # where the log said `npm notice version: 0.8.24` for a `-dev.` run).
          #
          # The edit is confined to the runner's checkout - nothing here is
          # committed or pushed - so the repository's own number is untouched.
          # UTC to the minute is what makes each build's version unique.
          if [ "${{ inputs.dev_release }}" = "true" ]; then
            STAMP=$(date -u +%Y%m%d%H%M)
            VER="$VER-dev.$STAMP"
            # Rewrite the one line, not the whole file: JSON.stringify would
            # reformat the manifest and strip the trailing newline, which turns a
            # version bump into a whole-file diff for anyone comparing the
            # tarball's manifest with the repository's.
            # shellcheck disable=SC2016  # $1/$2 are node's, not the shell's
            node -e '
              const fs = require("fs");
              const raw = fs.readFileSync("package.json", "utf8");
              const next = raw.replace(
                /("version"\s*:\s*")[^"]*(")/,
                "$1" + process.argv[1] + "$2"
              );
              if (next === raw) {
                console.error("no version line rewrote; refusing to publish an unstamped build");
                process.exit(1);
              }
              fs.writeFileSync("package.json", next);
            ' "$VER"
            echo "package.json now carries: $(node -p "require('./package.json').version")"
            echo "dist_tag=dev" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Check whether v<version> tag already exists (idempotency)
        id: tag
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git tag -l "$TAG" | grep -q "$TAG"; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            RELReleased=false
            echo "Tag $TAG exists; not creating it again."
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
            RELReleased=true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Publishing is a separate question from tagging. The npm step has its
          # own already-live guard, and the Release step is idempotent in gh, so
          # this only decides whether to ask them at all.
          if [ "${{ inputs.dev_release }}" = "true" ]; then
            # A stamped build always publishes, and it never creates a GitHub
            # Release: the Releases page is a record of shipped versions, and a
            # build every few minutes would bury it under noise.
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "dev build; publishing without a GitHub Release."
          elif [ "${{ inputs.force_publish }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "force_publish requested; running the release and publish steps."
          else
            # RELReleased is set in both branches above; do not re-read this step's own
            # outputs here, actionlint rejects self-reference within a step.
            PUBLISH="${RELReleased:-false}"
            echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
            echo "release=$PUBLISH" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release
        id: release
        if: steps.tag.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "pi-sleep-agent ${{ steps.version.outputs.version }}" \
            --notes "Release ${{ steps.version.outputs.version }} of pi-sleep-agent." \
            || echo "release already exists; continuing."
      - uses: actions/setup-node@v4
        if: steps.tag.outputs.publish == 'true'
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish to npm (skip only when the registry already serves the version)
        if: steps.tag.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # Which dist-tag the build lands on. `latest` is a promise to everyone
          # who runs `npm i pi-sleep-agent`, so only a real version sets it; a
          # stamped build goes to `dev`, where it can be installed by name and
          # still cannot reach a normal install. npm's own default tag is
          # `latest`, which is why passing this explicitly is the whole point.
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
          # A stored automation token wins when the repo has one, because the
          # trusted publisher on npmjs.com is a one-time setting outside this
          # repo and cannot be created from here. With the secret absent the step
          # falls through to OIDC, which needs no secret at all.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # OIDC exchange needs npm 11.5.1+; the setup-node above pins Node 22,
          # which ships npm 10, so the publish runs on an explicitly newer CLI.
          # Without this the registry answers 404 on a package that exists, which
          # is the failure this step's first real run produced.
          npm install -g npm@^11.5.1
          npm --version
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "auth: stored NPM_TOKEN secret"
          else
            echo "auth: npm Trusted Publishing (OIDC); no secret configured"
          fi
          # registry-viewer can lag behind the write. An E404 on a version that
          # IS live would otherwise send us into a publish that fails the run.
          for i in 1 2 3; do
            if npm view "pi-sleep-agent@$VERSION" version >/dev/null 2>&1; then
              echo "pi-sleep-agent@$VERSION already published; skipping."
              exit 0
            fi
            echo "attempt $i: pi-sleep-agent@$VERSION not visible yet"
            sleep 15
          done
          # No `--provenance` flag and no token: `id-token: write` plus the trusted
          # publisher on npmjs.com make npm attach provenance on its own. No `|| true`
          # either: a failed publish must fail the job, or a green run lies.
          echo "publishing with --tag $DIST_TAG"
          npm publish --access public --tag "$DIST_TAG"
